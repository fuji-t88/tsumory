<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tsumory</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-body-tertiary">
<header th:replace="~{fragments/header :: header('today')}"></header>

<main class="container app-container pb-4">
    <h1 class="h5 mb-3" th:text="${#temporals.format(today, 'yyyy年M月d日（E）')}">2026年5月17日（日）</h1>

    <div th:if="${message}" class="alert alert-warning" role="alert" th:text="${message}"></div>

    <section class="card shadow-sm mb-4">
        <div class="card-body">
            <h2 class="h5 card-title mb-3">いまの気持ちをつぶやく</h2>
            <form th:action="@{/posts}" th:object="${postForm}" method="post">
                <div class="mb-2">
                    <textarea th:field="*{content}" maxlength="100" rows="2" class="form-control"
                              th:disabled="${postLimitReached}"
                              th:classappend="${#fields.hasErrors('content')} ? 'is-invalid'"></textarea>
                    <p th:if="${#fields.hasErrors('content')}" th:errors="*{content}" class="invalid-feedback"
                       role="alert"></p>
                </div>
                <div class="d-flex align-items-center justify-content-end gap-3">
                    <span th:if="${postLimitReached}" class="text-body-secondary small"
                          th:text="|今日のつぶやきは ${postLimit} 件に達しました。明日またつぶやけます。|"></span>
                    <button type="submit" class="btn btn-primary" th:disabled="${postLimitReached}">つぶやく</button>
                </div>
            </form>
        </div>
    </section>

    <section class="card shadow-sm mb-4">
        <div class="card-body">
            <h2 class="h5 card-title mb-3">
                今日のつぶやき
                <span class="badge text-bg-secondary align-middle" th:text="|${#lists.size(posts)} 件|">0 件</span>
            </h2>
            <p th:if="${#lists.isEmpty(posts)}" class="text-body-secondary mb-0">まだつぶやきはありません。</p>
            <ul th:if="${not #lists.isEmpty(posts)}" class="list-group list-group-flush">
                <li th:each="post : ${posts}" class="list-group-item px-0">
                    <div th:unless="${editingPost != null and editingPost.id eq post.id}"
                         class="d-flex align-items-start gap-2">
                        <span class="text-body-secondary small flex-shrink-0 pt-1" style="min-width: 3rem;"
                              th:text="${post.time}"></span>
                        <div class="flex-grow-1">
                            <div th:text="${post.content}">コーヒーがおいしい</div>
                            <div class="d-flex flex-wrap align-items-center gap-2 mt-1">
                                <!-- カテゴリバッジ -->
                                <span th:replace="~{fragments/category-badge :: badge(${post.category})}"></span>
                                <!-- カテゴリ変更フォーム -->
                                <form th:action="@{/posts/{id}/category(id=${post.id})}" method="post" class="d-inline">
                                    <label th:for="|category-${post.id}|" class="visually-hidden">カテゴリ</label>
                                    <select th:id="|category-${post.id}|" name="category" onchange="this.form.submit()"
                                            class="form-select form-select-sm d-inline-block w-auto py-0">
                                        <option th:each="c : ${categories}" th:value="${c.name()}"
                                                th:text="${c.displayName}" th:selected="${c == post.category}">
                                            プライベート
                                        </option>
                                    </select>
                                </form>
                            </div>
                        </div>
                        <div class="flex-shrink-0 d-flex align-items-center gap-2 pt-1">
                            <a th:href="@{/posts/{id}/edit(id=${post.id})}" class="btn btn-link btn-sm p-0">編集</a>
                            <form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post" class="m-0">
                                <button type="submit" class="btn btn-link btn-sm p-0 text-danger">削除</button>
                            </form>
                        </div>
                    </div>
                    <form th:if="${editingPost != null and editingPost.id eq post.id}"
                          th:action="@{/posts/{id}/edit(id=${post.id})}" th:object="${postEditForm}" method="post">
                        <div class="mb-2">
                            <textarea th:field="*{content}" maxlength="100" rows="2" class="form-control"
                                      th:classappend="${#fields.hasErrors('content')} ? 'is-invalid'"></textarea>
                            <p th:if="${#fields.hasErrors('content')}" th:errors="*{content}"
                               class="invalid-feedback" role="alert"></p>
                        </div>
                        <div class="mb-2">
                            <label for="category" class="visually-hidden">カテゴリ</label>
                            <select th:field="*{category}" class="form-select form-select-sm w-auto"
                                    th:classappend="${#fields.hasErrors('category')} ? 'is-invalid'">
                                <option th:each="c : ${categories}" th:value="${c.name()}" th:text="${c.displayName}">
                                    プライベート
                                </option>
                            </select>
                            <!--/* 値が候補にないとき（画面を改ざんされた場合など）は型変換と @NotNull の 2 つのエラーが出るので、文言は 1 つにまとめる */-->
                            <p th:if="${#fields.hasErrors('category')}" class="invalid-feedback" role="alert">
                                カテゴリを選んでください
                            </p>
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/}" class="btn btn-outline-secondary btn-sm">キャンセル</a>
                            <button type="submit" class="btn btn-primary btn-sm">保存</button>
                        </div>
                    </form>
                </li>
            </ul>
        </div>
    </section>

    <section class="card shadow-sm">
        <div class="card-body">
            <h2 class="h5 card-title mb-3">今日の日記</h2>
            <div th:if="${diary != null}" class="d-flex align-items-center justify-content-between">
                <span class="badge text-bg-success">生成済</span>
                <a th:href="@{/diary/{date}(date=${today})}" class="btn btn-primary btn-sm">今日の日記を見る →</a>
            </div>
            <div th:if="${diary == null}">
                <div class="d-flex align-items-center justify-content-between mb-2">
                    <span class="badge text-bg-secondary">未生成</span>
                </div>
                <form th:action="@{/diary/generate}" method="post"
                      onsubmit="document.getElementById('genBtn').disabled = true; document.getElementById('genLoading').hidden = false;">
                    <button type="submit" id="genBtn" class="btn btn-primary"
                            th:disabled="${#lists.isEmpty(posts)}">日記を生成</button>
                    <span id="genLoading" hidden aria-live="polite" class="ms-2 text-body-secondary small">
                        日記を作成中です…しばらくお待ちください
                    </span>
                </form>
            </div>
        </div>
    </section>
</main>
</body>
</html>
