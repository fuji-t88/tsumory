<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- つぶやきの一覧。editingPostId の行だけ編集フォームにする -->
<ul th:fragment="postList(section)" class="list-unstyled mb-0">
    <li th:each="post : ${section.posts}" class="border-bottom py-2">

        <th:block th:if="${post.id == editingPostId}">
            <form th:action="@{/posts/{id}/edit(id=${post.id})}" th:object="${editForm}" method="post">
                <label for="edit-content" class="form-label">ひとこと</label>
                <textarea id="edit-content" th:field="*{content}" class="form-control" th:errorclass="is-invalid"
                          rows="3" maxlength="100" data-counter="edit-content-remaining"></textarea>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>
                <div class="d-flex justify-content-between align-items-center mt-2">
                    <span class="text-secondary small">
                        <span th:text="${post.postedTime}">08:12</span>
                        投稿時刻は変わりません
                    </span>
                    <span class="text-secondary small">残り <span id="edit-content-remaining"
                            th:text="${100 - (editForm.content?.length() ?: 0)}">100</span> 字</span>
                </div>
                <div class="d-flex align-items-center gap-2 mt-2">
                    <button type="submit" class="btn btn-primary">保存</button>
                    <a th:href="@{/}" class="btn btn-link">キャンセル</a>
                </div>
            </form>
            <form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post" class="mt-2"
                  data-confirm="このつぶやきを削除しますか？">
                <button type="submit" class="btn btn-outline-danger">削除</button>
            </form>
        </th:block>

        <div th:unless="${post.id == editingPostId}" class="d-flex gap-3">
            <span class="text-secondary" th:text="${post.postedTime}">08:12</span>
            <div class="flex-grow-1">
                <span class="text-pre-wrap" th:text="${post.content}">寝坊した</span>
                <span th:if="${post.edited}" class="text-secondary small">（編集済み）</span>
            </div>
            <a th:href="@{/posts/{id}/edit(id=${post.id})}" class="text-nowrap">編集</a>
        </div>

    </li>
</ul>

<!-- 日記の有無 -->
<span th:fragment="diaryStatus(section)" class="text-secondary small">
    <th:block th:if="${section.hasDiary()}"
              th:text="|日記あり（${#temporals.format(section.diary.generatedTime, 'HH:mm')} に作成）|">日記あり（21:30 に作成）</th:block>
    <th:block th:unless="${section.hasDiary()}">まだ日記はありません</th:block>
</span>
</body>
</html>
