<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${#temporals.format(date, 'yyyy年M月d日（E）')}の日記 - Tsumory|">日記 - Tsumory</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<!--/* 今日の日記なら「今日」、それ以外の日なら「日記一覧」を選択中にする */-->
<header th:replace="~{fragments/header :: header(${date == today} ? 'today' : 'diaries')}"></header>
<main class="container app-container pb-5">

    <!--/* フラッシュメッセージ（日記の生成に失敗したとき） */-->
    <div th:if="${message}" class="alert alert-danger" role="alert" th:text="${message}">日記の生成に失敗しました</div>

    <h1 class="h4 mb-3" th:text="|${#temporals.format(date, 'yyyy年M月d日（E）')}の日記|">2026年10月7日（水）の日記</h1>

    <!--/* 本文の欄。生成中は diary-generate.js が aria-busy を付け、ローディングの文言を出す */-->
    <section id="diary-body" class="mb-4">
        <!--/* ローディングの文言（ボタンを押した直後に表示する。JavaScript が無効なら出ない） */-->
        <div id="diary-loading" class="alert alert-light border" role="status" aria-live="polite" hidden>
            日記を書いています。1 分ほどかかることがあります。このままお待ちください
        </div>

        <!--/* 日記あり：本文と「作り直す」（作り直すのは今日の日記） */-->
        <th:block th:if="${diary != null}">
            <div id="diary-content" data-has-diary="true">
                <p class="text-pre-wrap" th:text="${diary.content}">日記の本文</p>
                <p class="text-secondary small" th:text="|${generatedAtTime} に作成|">21:30 に作成</p>
            </div>
            <!--/* 書く・作り直すのは今日の日記だけなので、今日の画面にだけ出す */-->
            <form th:if="${date == today}" th:action="@{/diary/generate}" method="post" class="js-diary-generate">
                <button type="submit" class="btn btn-outline-primary">作り直す</button>
            </form>
        </th:block>

        <!--/* 日記なし：「日記を書く」（書くのは今日の日記） */-->
        <th:block th:if="${diary == null}">
            <p id="diary-content">まだ日記はありません</p>
            <form th:if="${date == today}" th:action="@{/diary/generate}" method="post" class="js-diary-generate">
                <button type="submit" class="btn btn-primary">日記を書く</button>
            </form>
        </th:block>
    </section>

    <!--/* つぶやきへの導線（生成中も押せるままにする） */-->
    <section class="border-top pt-3">
        <a th:href="@{/}" class="btn btn-link px-0">つぶやきを直す</a>
        <p class="text-secondary small mb-0">しっくりこないときは、つぶやきを直してから作り直せます</p>
    </section>

</main>
<script th:src="@{/js/diary-generate.js}"></script>
</body>
</html>
