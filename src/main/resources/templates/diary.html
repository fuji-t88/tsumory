<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${#temporals.format(date, 'yyyy年M月d日（E）')}の日記 - Tsumory|">日記 - Tsumory</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<!--/* 今日の日記なら「今日」、それ以外の日なら「日記一覧」を選択中にする */-->
<header th:replace="~{fragments/header :: header(${date == today} ? 'today' : 'diaryList')}"></header>
<main class="container app-container pb-5">

    <!--/* フラッシュメッセージ（日記の生成に失敗したとき） */-->
    <div th:if="${message}" class="alert alert-danger" role="alert" th:text="${message}">日記の生成に失敗しました</div>

    <h1 class="h4 mb-3" th:text="|${#temporals.format(date, 'yyyy年M月d日（E）')}の日記|">2026年10月7日（水）の日記</h1>

    <!--/* 本文の欄。生成中は diary-generate.js が aria-busy を付け、ローディングの文言を出す */-->
    <section id="diary-body" class="mb-4">
        <!--/* ローディングの文言（ボタンを押した直後に表示する。JavaScript が無効なら出ない） */-->
        <div id="diary-loading" class="alert alert-light border" role="status" aria-live="polite" hidden>
            日記を書いています。1 分ほどかかることがあります。このままお待ちください
        </div>

        <!--/* 枠は 1 つにし、日記があるときだけ data-has-diary を付ける（diary-generate.js が読む） */-->
        <div id="diary-content" th:attr="data-has-diary=${diary != null} ? 'true'">
            <!--/* 日記あり：本文 */-->
            <th:block th:if="${diary != null}">
                <p class="text-pre-wrap" th:text="${diary.content}">日記の本文</p>
                <p class="text-secondary small" th:text="|${generatedAtLabel} に作成|">21:30 に作成</p>
            </th:block>
            <!--/* 日記なし */-->
            <th:block th:if="${diary == null}">
                <p class="mb-1">この日の日記はまだありません</p>
                <p class="text-secondary small" th:unless="${#lists.isEmpty(posts)}"
                   th:text="|この日のつぶやき ${#lists.size(posts)} 件から日記を書きます|">この日のつぶやき 3 件から日記を書きます</p>
                <p class="text-secondary small" th:if="${#lists.isEmpty(posts)}">この日のつぶやきはありません</p>
            </th:block>
        </div>

        <!--/* 日記あり：この画面の日付の日記を書き直す。つぶやきが 0 件の日も出す（押すとメッセージが出て、日記はそのまま残る） */-->
        <form th:if="${diary != null}" th:action="@{/diary/{date}/generate(date=${date})}" method="post"
              class="js-diary-generate">
            <button type="submit" class="btn btn-outline-primary">生成し直す</button>
        </form>
        <!--/* 日記なし：つぶやきがあれば「日記を生成」、なければボタンを出さない */-->
        <form th:if="${diary == null and not #lists.isEmpty(posts)}"
              th:action="@{/diary/{date}/generate(date=${date})}" method="post" class="js-diary-generate">
            <button type="submit" class="btn btn-primary">日記を生成</button>
        </form>
    </section>

    <!--/* この日のつぶやき（投稿時刻の古い順）。本文は読むだけで、編集・削除の操作は置かない */-->
    <section class="mb-4">
        <h2 class="h6">この日のつぶやき</h2>
        <p th:if="${#lists.isEmpty(posts)}" class="text-secondary mb-0">この日のつぶやきはありません</p>
        <ul th:unless="${#lists.isEmpty(posts)}" class="list-group list-group-flush">
            <li th:each="post : ${posts}" class="list-group-item px-0 d-flex align-items-start gap-2">
                <span class="text-secondary small flex-shrink-0 pt-1" style="min-width: 3rem;"
                      th:text="${post.time}">12:40</span>
                <div class="flex-grow-1">
                    <div th:text="${post.content}">昼のカレーが辛すぎた</div>
                    <div class="d-flex flex-wrap align-items-center gap-2 mt-1">
                        <span th:replace="~{fragments/category-badge :: badge(${post.category})}"></span>
                        <!--/* カテゴリだけを直す。JavaScript なしでも動くよう、選んだだけでは送信せず「変更」で送る。
                               date を付けて、直したあとこの日の日記表示に戻る */-->
                        <form th:action="@{/posts/{id}/category(id=${post.id})}" method="post"
                              class="d-flex align-items-center gap-1 m-0">
                            <input type="hidden" name="date" th:value="${date}">
                            <label th:for="|category-${post.id}|" class="visually-hidden">カテゴリ</label>
                            <select th:id="|category-${post.id}|" name="category"
                                    class="form-select form-select-sm d-inline-block w-auto py-0">
                                <option th:each="c : ${categories}" th:value="${c.name()}"
                                        th:text="${c.displayName}" th:selected="${c == post.category}">プライベート</option>
                            </select>
                            <button type="submit" class="btn btn-outline-secondary btn-sm">変更</button>
                        </form>
                    </div>
                </div>
            </li>
        </ul>
    </section>

    <!--/* つぶやきへの導線（生成中も押せるままにする）。つぶやきを直せる日付（今日と昨日）のときだけ出す */-->
    <section th:if="${postsEditable}" class="border-top pt-3">
        <a th:href="@{/}" class="btn btn-link px-0">つぶやきを直す</a>
        <p class="text-secondary small mb-0">しっくりこないときは、つぶやきを直してから作り直せます</p>
    </section>

</main>
<script th:src="@{/js/diary-generate.js}"></script>
</body>
</html>
