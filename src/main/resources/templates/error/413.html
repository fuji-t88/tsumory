<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ファイルが大きすぎます - Tsumory</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<!--/* アップロードの上限（spring.servlet.multipart.max-file-size）を超えたとき（phase3-spec.md の「6. 処理の詳細 > アップロードの大きさ（設定）」）。
       リクエストは controller に届く前に断られるので、入力した本文も残らない。ヘッダーはサービス名だけ（ほかのエラー画面と同じ） */-->
<header class="border-bottom mb-3">
    <div class="container app-container py-2">
        <a th:href="@{/}" class="navbar-brand fw-bold">Tsumory</a>
    </div>
</header>
<main class="container app-container py-5 text-center">
    <p class="display-6 text-secondary mb-2">413</p>
    <h1 class="h3 mb-3">ファイルが大きすぎます</h1>
    <p class="text-secondary mb-1" th:text="${photoTooLargeMessage}">写真は 5MB 以内にしてください</p>
    <p class="text-secondary mb-4">入力した内容は送られていません。写真を選び直して、もう一度つぶやいてください。</p>
    <a th:href="@{/}" class="btn btn-primary">今日のつぶやきへ戻る</a>
</main>
</body>
</html>
