spring:
  application:
    name: tsumory
  # 開発時はプロジェクト直下の .env（ANTHROPIC_API_KEY など）を読む。Spring Boot の標準機能なので依存の追加は不要。
  # optional: なので、.env がない環境（本番など）では無視され、OS の環境変数を使う
  config:
    import: optional:file:.env[.properties]
  threads:
    virtual:
      enabled: true
  # 日付の曜日などを日本語で出す（ブラウザの言語設定によらない）
  web:
    locale: ja_JP
    locale-resolver: fixed
  jpa:
    properties:
      hibernate:
        format_sql: true

# Claude API の呼び出しの設定（仕様 6 章）。API キーはここに書かず、環境変数 ANTHROPIC_API_KEY か .env で渡す
anthropic:
  model: claude-opus-5-5
  effort: medium
  max-tokens: 16000
  timeout: 120s
  # つぶやきのカテゴリ分類（docs/phase2-spec.md の「7. AI 連携（カテゴリ分類）」）
  classification:
    model: claude-opus-5-5
    effort: low
    max-tokens: 2000
    # 投稿・編集の応答が分類を待つので、クライアント全体の timeout（120s）より短くする
    timeout: 10s

# 開発中の SQL 可視化。bind パラメータにはつぶやきや日記の本文が含まれるため、
# 本番デプロイ時は必ず無効化すること。
logging:
  pattern:
    # RequestLoggingFilter が requestId / userId を MDC に入れる。
    # 全ログ行に [req=... user=...] を出して、本番障害時にユーザーとリクエストを特定できるようにする。
    # console を全部書き換えず、レベルの列だけを上書きして Spring Boot の標準の形式を活かす
    level: "%5p [req=%X{requestId:-} user=%X{userId:-}]"
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
