spring:
  application:
    name: tsumory
  threads:
    virtual:
      enabled: true
  # 日付の曜日などを日本語で出す（ブラウザの言語設定によらない）
  web:
    locale: ja_JP
    locale-resolver: fixed
  jpa:
    properties:
      hibernate:
        format_sql: true

# Claude API の呼び出しの設定（仕様 6 章）。API キーはここに書かず、環境変数 ANTHROPIC_API_KEY で渡す
anthropic:
  model: claude-opus-5-5
  effort: medium
  max-tokens: 16000
  timeout: 120s

# 開発中の SQL 可視化。bind パラメータにはつぶやきや日記の本文が含まれるため、
# 本番デプロイ時は必ず無効化すること。
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
