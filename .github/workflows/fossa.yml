# 依存のライセンスを FOSSA で調べる（CLAUDE.md の「CI/CD > FOSSA」）。ci.yml とは分け、デプロイは止めない
name: FOSSA

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  fossa:
    name: FOSSA license scan
    # Dependabot の PR は Actions の Secret（FOSSA_API_KEY）を読めない（snyk.yml と同じ）
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # FOSSA の CLI が gradlew で依存を解決する。toolchain の Java 21 を入れておく
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Git に gradlew が実行権限なしで入っている（ci.yml と同じ）
      - run: chmod +x gradlew

      # 依存の一覧を FOSSA に送る
      - uses: fossas/fossa-action@29693cc50323968e039056be419b32989fc5880c # v2.0.0
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
          pinned-cli-version: v3.20.1
          branch: ${{ github.head_ref || github.ref_name }}

      # FOSSA のポリシーに違反するライセンスがあれば落とす
      - uses: fossas/fossa-action@29693cc50323968e039056be419b32989fc5880c # v2.0.0
        with:
          api-key: ${{ secrets.FOSSA_API_KEY }}
          pinned-cli-version: v3.20.1
          branch: ${{ github.head_ref || github.ref_name }}
          run-tests: true
