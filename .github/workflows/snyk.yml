# 依存の脆弱性を Snyk で調べる（CLAUDE.md の「CI/CD > Snyk」）。ci.yml とは分け、デプロイは止めない
name: Snyk

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snyk:
    # Dependabot の PR は Actions の Secret（SNYK_TOKEN）を読めない。Snyk の GitHub 連携の PR チェックで見る
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      # Git に gradlew が実行権限なしで入っている（ci.yml と同じ）
      - run: chmod +x gradlew
      # 本番の jar に入る依存（runtimeClasspath）だけを見て、high 以上があれば落とす
      - run: >-
          npx --yes snyk@1.1307.4 test
          --configuration-matching='^runtimeClasspath$'
          --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
