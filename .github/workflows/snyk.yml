# 依存の脆弱性を Snyk で調べる（CLAUDE.md の「CI/CD > Snyk」）。ci.yml とは分け、デプロイは止めない
name: Snyk Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  snyk:
    name: Snyk vulnerability scan
    # Dependabot の PR は Actions の Secret（SNYK_TOKEN）を読めない。Snyk の GitHub 連携の PR チェックで見る
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Git に gradlew が実行権限なしで入っている（ci.yml と同じ）
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Snyk Open Source test
        # v1.0.0。@master は Snyk 側の変更がそのまま動くので、コミットで固定する
        uses: snyk/actions/gradle-9-jdk21@9adf32b1121593767fc3c057af55b55db032dc04
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high
