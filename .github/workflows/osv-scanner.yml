# 依存の脆弱性を OSV-Scanner で調べる（CLAUDE.md の「CI/CD > OSV-Scanner」）。
# ci.yml とは分け、デプロイは止めない
name: OSV-Scanner

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  # 依存を変えなくても、新しい脆弱性は公開される
  schedule:
    - cron: "0 0 * * 1"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # OSV-Scanner は build.gradle.kts を直接読むのではなく、
  # 解決済み依存関係の一覧（gradle.lockfile）を作ってスキャンする
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"


      # Git に gradlew が実行権限なしで入っているため付与
      - run: chmod +x gradlew

      # build.gradle.kts を変更せず、
      # このジョブ内だけで全ConfigurationのDependency Lockingを有効化
      - run: |
          cat > "$RUNNER_TEMP/lock.init.gradle.kts" <<'EOF'
          allprojects {
              dependencyLocking {
                  lockAllConfigurations()
              }
          }
          EOF

          ./gradlew \
            --init-script "$RUNNER_TEMP/lock.init.gradle.kts" \
            dependencies \
            --write-locks \
            > /dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: gradle-lockfile
          path: gradle.lockfile
          retention-days: 1

  scan:
    needs: lockfile

    permissions:
      actions: read
      contents: read
      security-events: write

    # OSV-Scanner v2.6.0
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc

    with:
      download-artifact: gradle-lockfile

      # リポジトリ全体ではなく、
      # 上で生成した実際の解決済み依存関係だけをスキャンする
      scan-args: |-
        --lockfile=gradle.lockfile